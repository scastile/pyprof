[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyprof"
version = "0.1.0"
description = "Real-time cProfile visualization — interactive flame graphs, call trees, diff comparison"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
authors = [
    {name = "scastile", email = "paperscratcher@gmail.com"},
]
keywords = ["profiling", "cprofile", "flame-graph", "performance", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]

[project.scripts]
pyprof = "pyprof.cli:main"

[project.urls]
Homepage = "https://github.com/scastile/pyprof"
Repository = "https://github.com/scastile/pyprof"
Issues = "https://github.com/scastile/pyprof/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyprof"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pyprof --cov-report=term-missing"

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
